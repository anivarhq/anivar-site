<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Pages serves this file for ANY unmatched path at ANY depth, so neither
     root-relative (/assets/…) nor document-relative (assets/…) paths can be
     right on a project page: the first resolves above the site, the second
     below it. A <base> fixes both, and it must precede every URL below.
     Change this one line to "/" if the site ever moves to a domain root. -->
<base href="/anivar-site/">
<title>Not found — Anivar</title>
<meta name="theme-color" content="#FBFAF8">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="hero" style="min-height:100vh;min-height:100svh;display:grid;place-items:center">
  <div class="wrap">
    <svg viewBox="0 0 400 240" role="img" aria-label="A camera tile showing no signal" style="width:min(420px,100%);margin:0 auto 44px;border-radius:16px;background:var(--tile);border:1px solid var(--line)">
      <circle cx="20" cy="20" r="4" fill="#C4BAAE"/>
      <text class="s-tb" x="31" y="24" font-size="11.5">This page</text>
      <text class="s-m" x="384" y="24" font-size="10.5" text-anchor="end">--:--:--</text>
      <path class="s-soft" d="M0 176 H400"/>
      <image href="assets/fluffy.svg" x="167" y="80" width="66" height="66"/>
      <text class="s-m" x="200" y="206" font-size="12" text-anchor="middle">no signal</text>
    </svg>
    <h1 style="font-size:clamp(40px,6vw,72px)">Nothing <em>recorded</em> here.</h1>
    <p class="lede">That page doesn't exist — or it moved.</p>
    <div class="cta"><a class="btn btn-ink" href="./">Back to the start</a></div>
  </div>
</main>
</body>
</html>
