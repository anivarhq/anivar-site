<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Pages serves this file for ANY unmatched path at ANY depth, so neither
     root-relative (/assets/…) nor document-relative (assets/…) paths can be
     right on a project page: the first resolves above the site, the second
     below it. A <base> fixes both, and it must precede every URL below.
     Change this one line to "/" if the site ever moves to a domain root. -->
<base href="/anivar-site/">
<title>Not found — Anivar</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="hero" style="min-height:70vh">
  <div class="liquid-bg"></div>
  <div class="wrap">
    <img class="mascot" src="assets/fluffy.svg" alt="" width="66" height="66">
    <h1>Nothing recorded here.</h1>
    <p class="lede">That page does not exist.</p>
    <div class="cta"><a class="btn btn-primary" href="./">Back to the start</a></div>
  </div>
</header>
</body>
</html>
